name: Scheduled HubSpot sync

# Pulls what HubSpot webhooks don't deliver (marketing emails, page views,
# form submissions, missed/edited/deleted activity) — see
# lib/scheduledHubSpotSync.ts. Needs the repo secret CRON_SECRET, matching
# CRON_SECRET in Azure. Split into short requests because Azure Static Web
# Apps ends any API request after ~45 seconds.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      URL: https://apex.sphaera.tech/api/cron/hubspot-sync
    steps:
      - name: Activity (new, edited, deleted)
        run: |
          curl -fsS --max-time 60 --retry 2 -X POST -H "Authorization: Bearer $CRON_SECRET" "$URL?step=activity"
          echo
      - name: Marketing emails, page views, forms
        run: |
          offset=0
          while [ -n "$offset" ]; do
            out=$(curl -fsS --max-time 60 --retry 2 -X POST -H "Authorization: Bearer $CRON_SECRET" "$URL?step=behavioral&offset=$offset")
            echo "$out"
            offset=$(echo "$out" | jq -r '.nextOffset // empty')
          done
